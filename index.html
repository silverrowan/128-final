<!-- CART MODAL -->
    <!-- Vertically centered modal -->
<div class="modal" tabindex="-1">
<div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Booking:</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <!-- ADD TO CART MODAL -->
      <div class="modal-body">
        <h4>ROOMNAME</h4>
        <h5>at HotelName</h5>
        <form id="cartForm" action="" method="POST">
            <label for="checkInDate">Check In (4pm)</label>
            <input type="date" required id="checkInDate">
            <label for="checkOutDate">Check Out (11am)</label>
            <input type="date" required id="checkOutDate">
            <!-- <input type="number"># rooms -->
             <!-- REWORK SET UP FOR CART OFFCANV CURRENTLY -->
            <div class="d-flex justify-content-between">
                <div class="cartItemDateDiv d-flex">
                    <div class="d-flex justify-content-evenly align-items-center flex-column">
                        <label for="roomStartNUMBERSTART">Start</label>
                        <input type="date" id="roomStartNUMBERSTART" name="roomStart" />
                    </div>
                    <div class="d-flex justify-content-evenly align-items-center flex-column">
                        <label for="roomEndNUMBERSTART">End</label>
                        <input type="date" id="roomEndNUMBERSTART" name="roomEnd" />
                    </div>
                </div>
                <div class="cartItemCount d-flex flex-column align-items-end justify-content-end">
                    <p class="NUMBERSTARTmath">NumberofNights x $COST/night</p>
                    <h5 class="NUMBERSTARTsubtotal h5" >SUBTOTAL</h5>
                </div>
            </div>
            <!-- <p>At ---- per night</p> -->
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary">Book</button>
      </div>
    </div>
  </div>
</div>

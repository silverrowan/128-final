<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hotel Booking Dashboard</title>
	<!--Bootstrap links-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!--jQuery-->
	<script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <!-- Leaflet style & scripts -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
    <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
	<!-- My Styles and Scripts -->
	<link rel="stylesheet" href="style\style.css">
	<script defer src="script\rooms.js"></script>
	<script defer src="script\map.js"></script>
</head>
<body>
<!--NAVBAR-->
<nav class="navbar navbar-expand-lg mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Hotel Booking Dashboard</a>
    </div>
</nav>
<!--MAIN-->  
<main class="container-fluid">
    <div class="row">
        <div class ="col">
            <div id="map"></div>
        </div>
    </div>
    <div class="row">
        <h1>Rooms</h1>
        <div class ="col">            
            <div class="card m-3 d-flex flex-row">
					<div class="img-contain d-flex align-items-stretch">
						<img class="card-img-top card-img-bottom card-img imgCoverFit " src="includes\img\04-single.jpg">
					</div>	
					<div class="card-body d-flex flex-column">
						<h2 class="card-title" id="">Locations</h2>
						<hr class="w100">
						<p class="card-text" id="">Single Room with a bed</p>
						<p class="card-title h3" id="">$159</p>
                        
						<button id="roomBtn0" btnnum="0" class="btn btn-primary align-self-end">Book Room</button>
					</div>
				</div>
            
        </div>
    </div>
</main>
<!--FOOTER-->
<div class="container-fluid foot">
    <footer class="row d-flex flex-wrap justify-content-between align-items-center py-3">
        <div class="col-md-4 d-flex align-items-center">
            <span class="mb-3 mb-md-0 text-body-secondary">© 2026</span>
        </div>
    </footer>
</div>
</body>
</html>

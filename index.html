<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hotel Booking Dashboard</title>
	<!--Bootstrap links-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!--jQuery-->
	<script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <!-- Leaflet style & scripts -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
    <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>

	<link rel="stylesheet" href="style\style.css">
	<script defer src="script\classes.js"></script>
	<script defer src="script\dataAccess.js"></script>
	<script defer src="script\initialLoad.js"></script>
	<script defer src="script\map.js"></script>
	<script defer src="script\rooms.js"></script>
	<script defer src="script\cart.js"></script>
	<script defer src="script\checkout.js"></script>
</head>
<body>
<!--NAVBAR-->
<nav class="navbar navbar-expand-lg mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Hotel Booking Dashboard</a>
        <button id="navCartBtn" class="btn btn-success" type="button">Cart</button>
    </div>
</nav>
<!-- CART BookModal --><!-- Vertically centered BookModal -->
<div class="modal" id="bookingModal" data-bs-backdrop="static" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header flex-row justify-space-between">
                <div id="BookingModalTitle" class="flex-column align-start">
                    <h4 class="modal-title"></h4>
                    <h5 class="h6 fst-italic"></h5>
                </div>
                <button type="button" id="closeBtn" class="btn-close align-self-start" aria-label="Close"></button>
            </div>  
            <div class="modal-body">    
                <form id="cartForm" action="" method="POST">
                    <div class="cartItemDateDiv d-flex justify-content-center mb-2">
                        <div class="d-flex justify-content-evenly align-items-center flex-column mx-3">
                            <label for="checkInDate">Check In (4pm)</label>
                            <input type="date" id="checkInDate" name="roomStart" />
                        </div>
                        <div class="d-flex justify-content-evenly align-items-center flex-column mx-3">
                            <label for="checkOutDate">Check Out (11am)</label>
                            <input type="date" id="checkOutDate" name="roomEnd" />
                        </div>
                    </div>
                    <div id="BookModalroomTotalDiv" class="cartItemCount d-flex flex-column align-items-end justify-content-end">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" id="cancelBtn" class="btn btn-outline-secondary">Cancel</button>
                <button type="button" id="bookBtn" class="btn btn-primary">Book</button>
            </div>
        </div>
    </div>
</div>
<!-- Confirm Clear Modal -->
<div class="modal" id="confClearModal" data-bs-backdrop="static" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header flex-row justify-space-between">
                <div id="BookingModalTitle" class="flex-column align-start">
                    <h4 class="modal-title"></h4>
                </div>
                <button type="button" id="clearCloseBtn" class="btn-close align-self-start" aria-label="Close"></button>
            </div>  
            <div class="modal-body">    
                <p>Are you sure you want to remove everything?</p>
                <p>You will lose your holds on all rooms in the cart."</p>
            </div>
            <div class="modal-footer">
                <button type="button" id="cancelClearBtn" class="btn btn-outline-success">Cancel</button>
                <button type="button" id="confirmClearBtn" class="btn btn-danger">Empty Cart</button>
            </div>
        </div>
    </div>
</div>
<!-- Buildable Confirm Dialog -->
 <div class="modal" id="buildModal" data-bs-backdrop="static" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header flex-row justify-space-between">
                <div id="buildModalTitle" class="flex-column align-start">
                    <h4 class="modal-title"></h4>
                </div>
                <button type="button" id="clearCloseBtn" class="btn-close align-self-start" aria-label="Close"></button>
            </div>  
            <div class="modal-body">    
                <p>Dialog message/question</p>
            </div>
            <div class="modal-footer">
                <button type="button" id="buildCancelBtn" class="btn btn-outline-success">Cancel</button>
                <button type="button" id="buildConfirmBtn" class="btn btn-danger">Confirm</button>
            </div>
        </div>
    </div>
</div>
<!-- Buildable Message Dialog -->
 <div class="modal" id="messageModal" data-bs-backdrop="static" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header flex-row justify-space-between">
                <div id="messageModalTitle" class="flex-column align-start">
                    <h4 class="modal-title"></h4>
                </div>
                <button type="button" id="messageCloseBtn" class="btn-close align-self-start" aria-label="Close"></button>
            </div>  
            <div class="modal-body">    
                <p>Dialog message</p>
            </div>
            <div class="modal-footer">
                <button type="button" id="buildYBtn" class="btn btn-danger">Yes</button>
            </div>
        </div>
    </div>
</div>
<!-- CART OFFCANVAS -->
<div id="cartWrapperDiv" class="offcanvas card justify-content-start align-items-end flex-column">
    <form id="cartForm" action="" method="POST">
        <div id="cartCardsDiv">
        </div>
        <!-- TOTALS -->
        <div id="cartTail" class="d-flex flex-column align-items-end mx-3 mb-3 card-body">
            <div id="cartSumLines" class="d-flex flex-column align-items-end">
            </div>
            <div class="d-flex justify-content-between mt-5">
                <button type="button" id="cartClearBtn" class="btn btn-lg btn-outline-danger me-3">CLEAR CART</button>
                <button type="button" id="cartCheckoutBtn" class="btn btn-lg btn-success">CHECKOUT</button>
            </div>
        </div>
    </form>
</div>
<!-- CHECKOUT Modal --><!-- Vertically centered Modal -->
<div class="modal" id="coutModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header flex-row justify-space-between">
                <div id="coutModalTitle" class="flex-column align-start">
                    <h4 class="modal-title">Checkout</h4>
                </div>
                <button type="button" id="coutCloseBtn" class="btn-close align-self-start" aria-label="Close"></button>
            </div>       
            <div class="modal-body">    
                <form id="coutForm" action="" method="POST">
                    <div class="container flex-column">
                        <div class="row g-3 mb-3">
                            <div class="form col-6 g-3" >
                                <label class="form-label" for="firstNameTxt" id="firstNameTxtLbl">Given Name*</label>
                                <input type="text" class="form-control" id="firstNameTxt" name="firstName" placeholder=" " required/>
                                <label class="form-label hidden formTip" for="firstNameTxt" id="firstNameTxtTip">
                                    A given name is required. Please enter a valid name. (Letters and spaces are accepted)</label>
                            </div>
                            <div class="form col-6 g-3" >
                                <label class="form-label" for="lastNameTxt" id="lastNameTxtLbl">Family Name*</label>
                                <input type="text" class="form-control" id="lastNameTxt" name="lastName" placeholder=" " required/>
                                <label class="form-label hidden formTip" for="lastNameTxt" id="lastNameTxtTip">
                                    A family name is required. Please enter a valid name. (Letters and spaces are accepted)</label>
                            </div>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="form col-4 g-3" >
                                <label class="form-label" for="phoneIn" id="phoneInLbl">Phone Number</label>
                                <input type="tel" class="form-control" id="phoneIn" name="phone" placeholder=" " autocomplete="on"/>
                                <label class="form-label hidden formTip" for="phoneIn" id="phoneInTip">
                                    Please enter a valid Phone number. (###-###-####)</label>
                            </div>
                            <div class="form col-8 g-3" >
                                <label class="form-label" for="emailIn" id="emailInLbl">Email*</label>
                                <input type="email" class="form-control" id="emailIn" name="email" placeholder=" " required autocomplete="on"/>
                                <label class="form-label hidden formTip" for="emailIn" id="emailInTip">
                                    An email is required. Please enter a valid email.</label>
                                </div>
                            </div>
                        <div class="row g-3 my-3"><hr></div>
                        <div class="row g-3 my-3"><h5>Mailing Address</h5></div>
                        <div class="row g-3 mb-3">
                            <div class="form col g-3" >
                                <label class="form-label" for="pstAddressTxt" id="pstAddressTxtLbl">Address</label>
                                <input type="text" class="form-control" id="pstAddressTxt" name="stAddress" placeholder=" "/>
                                <label class="form-label hidden formTip" for="pstAddressTxt" id="pstAddressTxtTip">Please enter a valid address.</label>
                            </div>                        
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="form col-7 g-3" >
                                <label class="form-label" for="pcityTxt" id="pcityTxtLbl">City</label>
                                <input type="text" class="form-control" id="pcityTxt" name="city" placeholder=" "/>
                                <label class="form-label hidden formTip" for="pcityTxt" id="pcityTxtTip">Please enter a valid city name.</label>
                            </div>
                            <div class="form  col-5 g-3" >                                
                                <label class="form-label" for="pzipTxt" id="pzipTxtLbl">Postal Code / ZIP</label>
                                <input type="text" class="form-control" id="pzipTxt" name="zip" placeholder=" "/>
                                <label class="form-label hidden formTip" for="pzipTxt" id="pzipTxtTip">Please enter a valid postal or zip code.</label>
                            </div>                        
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="form  col-5 g-3" >
                                <label class="form-label" for="pstateTxt" id="pstateTxtLbl">Provence / State</label>
                                <input type="text" class="form-control" id="pstateTxt" name="state" placeholder=" "/>
                                <label class="form-label hidden formTip" for="pstateTxt" id="pstateTxtTip">Please enter a valid region name.</label>
                            </div>
                            <div class="form  col-7 g-3" >
                                <label class="form-label" for="pcountryTxt" id="pcountryTxtLbl">Country</label>
                                <input type="text" class="form-control" id="pcountryTxt" name="country" placeholder=" " autocomplete="on"/>
                                <label class="form-label hidden formTip" for="pcountryTxt" id="pcountryTxtTip">Please enter a valid country name.</label>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer d-flex justify-content-between">
                <button type="button" id="coutCancelBtn" class="btn btn-outline-secondary">Cancel</button>
                <button type="button" id="coutContinueBtn" class="btn btn-success">Continue</button>
            </div>
        </div>
    </div>
</div>
<!-- CONFIRM PURCHASE Modal -->
 <div class="modal" id="coutConfModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">

            <div class="modal-header flex-row justify-space-between">
                <div id="coutModalTitle" class="flex-column align-start">
                    <h4 class="modal-title">Confirm Purchase Details</h4>
                </div>
                <button type="button" id="coutConfCloseBtn" class="btn-close align-self-start" aria-label="Close"></button>
            </div>   

            <div class="modal-body" id="confCheckoutDetailsContent">
                <!-- 
                ...customer name
                ...sustomer contact info (email, phone)
                ...customer address
                <hr>
                booking:
                for each cart item:
                    hotel - room 
                    maximum guests: #    
                    dates (num days)

                    total
                Buttons -> on yes, pop up 'please contact xyz to pay within 24 hrs' 
                advance all cart bookings to paid
                make purchase object with the customer and booking and totals info.
                clear cart
                save cleared cart to local
                -->
            </div>

            <div class="modal-footer d-flex justify-content-between">
                <button type="button" id="coutConfPrevBtn" class="btn btn-secondary">Previous</button>
                <button type="button" id="coutConfContinueBtn" class="btn btn-success">Continue</button>
            </div>

        </div>
    </div>
</div>

<div class="container-fluid foot">
